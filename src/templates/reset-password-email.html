<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; background: #f7f7f7; padding: 20px"
  >
    <div
      style="
        max-width: 400px;
        margin: auto;
        background: #fff;
        padding: 15px;
        border-radius: 6px;
        text-align: center;
      "
    >
      <h3>Hello {{name}},</h3>
      <p>You requested to reset your password.</p>
      <p>
        <a
          href="{{resetLink}}"
          style="
            display: inline-block;
            padding: 10px 16px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
          "
        >
          Reset Password
        </a>
      </p>
      <p>If you didn’t request this, you can ignore the email.</p>
    </div>
  </body>
</html>
